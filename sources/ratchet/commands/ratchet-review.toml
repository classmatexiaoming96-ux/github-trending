description = "Review the current diff for over-engineering and return a delete list"
prompt = "Review the current changes for over-engineering only, not correctness. Use git diff. One line per finding, ranked by lines removable: <path>:<line> <tag>: <what to cut>. <what replaces it>. Tags: exists (this repository already has it, give the path), stdlib (the standard library ships it, name the function), native (the platform does it, name the feature), yagni (one implementation, one caller, or nothing reads it), wrapper (forwards and adds nothing), shrink (same behaviour, fewer lines). Verify each replacement exists for this project's language version and target runtime before reporting it. Never flag a smoke test, a self check, validation at a trust boundary, error handling that prevents data loss, or an accessibility attribute. End with net: -<N> lines, -<M> dependencies. If there is nothing to cut, say: Lean. Ship it."
