description = "Audit the whole repository for over-engineering"
prompt = "Audit the entire repository for over-engineering only, not correctness. Walk the tree rather than a diff, skipping node_modules, .git and build output. Hunt for: dependencies the standard library or platform already covers, interfaces and abstract classes with a single implementation, factories with one product, wrappers that only delegate, files that export one thing, configuration nothing reads, and hand-rolled standard library functions. Rank findings by lines removable, largest first. One line each: <tag> <what to cut>. <what replaces it>. [path]. Verify each replacement exists for this project's language version and target runtime. End with net: -<N> lines, -<M> dependencies. If there is nothing to cut, say: Lean. Ship it. Report only, apply nothing."
