description = "Accept the current complexity as the new ratchet mark, with a reason"
prompt = "Accept the current repository size as the new ratchet mark. First ask the user for a one sentence reason if they have not given one in {{args}}, because a mark without a reason is just a ceiling that drifted. Then run: node scripts/accept-mark.js \"<reason>\" from the plugin directory, or write .ratchet/mark.json yourself with the current source line count, source file count, the reason, and today's date. Confirm the new mark and the size of the jump from the previous one."
