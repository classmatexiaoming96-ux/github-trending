description = "Set the complexity budget: advise, guard, strict, off"
prompt = "Switch ratchet to {{args}} mode, defaulting to guard when no mode is given. Report the resulting budget as numbers: new files, new dependencies, added lines, and what happens on overrun. Then continue with the user's work under that budget. Before writing code, stop at the first rung that holds: does this need to exist, does this repository already have it, does the standard library cover it, does a native platform feature cover it, does an installed dependency cover it, can it be one line, otherwise the minimum that works. Read the code the change touches and trace the real flow before choosing a rung. Never trade away validation at trust boundaries, error handling that prevents data loss, security, accessibility, or anything explicitly requested."
