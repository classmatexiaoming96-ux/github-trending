description = "Quick reference for ratchet modes, commands and configuration"
prompt = "Show the ratchet quick reference. Change nothing: do not switch mode or write files. Modes and their budgets: advise (8 new files, 3 new dependencies, 400 added lines, findings only), guard (3, 1, 150, findings plus budget warnings, this is the default), strict (1, 0, 60, the edit is blocked on overrun), off. Switch with /ratchet <mode>, persist with /ratchet default <mode>, or set RATCHET_MODE. Commands: /ratchet-review (over-engineering review of the current diff), /ratchet-audit (the same for the whole repository), /ratchet-ledger (measured trend, mark, and deferred shortcuts), /ratchet-accept (record a new complexity mark with a reason), /ratchet-help (this card). What the hook measures on every edit: new dependencies in any manifest, reinvented standard library calls, single-implementation abstractions, forwarding wrappers, symbols that duplicate something already in the repository, and the running line, file and dependency budget. Per project configuration lives in .ratchet/config.json with mode, budget and ignore fields; the ledger and the mark live in .ratchet/ and are meant to be committed. Turn off with 'stop ratchet'."
