description = "Show the measured complexity trend, the mark, and deferred shortcuts"
prompt = "Report what the ratchet has actually measured in this repository, in three sections, using real recorded numbers only. First, the trend: read .ratchet/ledger.jsonl and report the last ten sessions with date, mode, lines added, new dependencies, findings by tag, and the repository line count at the end of each. State the direction plainly. If the file is missing, say the ratchet is not initialised here and that creating a .ratchet directory turns it on, and invent nothing. Second, the mark: read .ratchet/mark.json and compare it to the repository now, reporting either At the mark or the size of the gap and the reason recorded on the mark. Third, the shortcuts: grep -rnE '(#|//|--) ?ratchet:' skipping node_modules and .git, one row per hit grouped by file, giving what was simplified, the ceiling named in the comment, and the upgrade trigger; tag any marker with no trigger as no-trigger. End with the count of shortcuts and how many lack a trigger. Never report what a session saved, the version that was not written has no baseline to subtract from."
