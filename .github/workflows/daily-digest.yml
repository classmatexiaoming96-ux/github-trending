name: Daily Digest

on:
  schedule:
    # 每天 08:00 UTC = 16:00 北京时间
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser requests

      - name: Run prefetch
        run: |
          python scripts/daily-digest/prefetch.py

      - name: Update dates.json
        run: |
          cd data
          DATES=$(ls -1 [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].json 2>/dev/null | sed 's/.json$//' | sort -r | head -90)
          echo "[${DATES}]" | sed 's/ /,/g' > dates.json

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || git commit -m "docs: update daily digest $(date +%Y-%m-%d)"
          git push
