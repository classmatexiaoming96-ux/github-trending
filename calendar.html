<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 日报已迁移</title>
<meta name="description" content="AI 日报日历已迁移到个人主页的每日 AI 速递模块" />
<style>
:root {
  --bg: #0a0b0e;
  --card: #14161e;
  --border: rgba(255, 255, 255, 0.12);
  --text: #e7e9f0;
  --text-dim: #a3a9b8;
  --text-faint: #6f7585;
  --gold: #e0b07a;
  --cyan: #54d6e0;
  --green: #7fcf9e;
  --sans: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: 24px;
  background:
    radial-gradient(780px 420px at 78% 8%, rgba(224, 176, 122, 0.12), transparent 62%),
    radial-gradient(680px 380px at 15% 18%, rgba(84, 214, 224, 0.10), transparent 58%),
    var(--bg);
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.6;
}
.migration-card {
  width: min(100%, 520px);
  padding: 38px 34px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: linear-gradient(180deg, rgba(20, 22, 30, 0.96), rgba(13, 15, 20, 0.96));
  box-shadow: 0 28px 80px rgba(0, 0, 0, 0.34);
  text-align: center;
}
.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 5px 12px;
  border: 1px solid rgba(84, 214, 224, 0.34);
  border-radius: 999px;
  color: var(--cyan);
  background: rgba(84, 214, 224, 0.10);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
}
h1 {
  margin: 18px 0 10px;
  font-size: clamp(30px, 6vw, 46px);
  line-height: 1.15;
}
p {
  margin: 0;
  color: var(--text-dim);
  font-size: 16px;
}
.cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 26px;
  min-height: 48px;
  padding: 0 22px;
  border-radius: 12px;
  border: 1px solid rgba(224, 176, 122, 0.42);
  background: rgba(224, 176, 122, 0.12);
  color: var(--gold);
  font-weight: 700;
  text-decoration: none;
  transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
}
.cta:hover {
  transform: translateY(-1px);
  border-color: rgba(224, 176, 122, 0.72);
  background: rgba(224, 176, 122, 0.18);
}
.meta {
  margin-top: 18px;
  color: var(--text-faint);
  font-size: 13px;
}
#countdown {
  color: var(--green);
  font-weight: 800;
}
</style>
</head>
<body>
  <main class="migration-card">
    <div class="badge">已迁移</div>
    <h1>📰 每日 AI 速递</h1>
    <p>日历模块已迁至个人主页子站</p>
    <a href="https://classmatexiaoming96-ux.github.io/daily-digest/calendar.html" class="cta">→ 前往新版日报</a>
    <p class="meta">将在 <span id="countdown">3</span> 秒后自动跳转</p>
  </main>

  <script>
  const target = "https://classmatexiaoming96-ux.github.io/daily-digest/calendar.html";
  let seconds = 3;
  const countdown = document.getElementById("countdown");
  const timer = setInterval(() => {
    seconds -= 1;
    countdown.textContent = seconds;
    if (seconds <= 0) {
      clearInterval(timer);
      window.location.href = target;
    }
  }, 1000);
  </script>
</body>
</html>
