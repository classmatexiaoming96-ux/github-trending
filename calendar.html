<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 日报 · 日历</title>
<meta name="description" content="AI 日报日历 — 点击日期查看当日资讯" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0b0e'/%3E%3Ccircle cx='30' cy='35' r='10' fill='%2354d6e0'/%3E%3Ccircle cx='70' cy='35' r='10' fill='%23e9b873'/%3E%3Ccircle cx='30' cy='70' r='10' fill='%23e08a64'/%3E%3Ccircle cx='70' cy='70' r='10' fill='%237fcf9e'/%3E%3C/svg%3E" />
<style>
/* ============================================================
   Daily Digest — 日历页面
   ============================================================ */
:root {
  --bg:        #0a0b0e;
  --bg-grad:   #0c0e14;
  --bg-elev:   #111319;
  --bg-card:   #14161e;
  --bg-card-2: #181b24;
  --border:    rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);

  --text:      #e7e9f0;
  --text-dim:  #a3a9b8;
  --text-faint:#6f7585;

  --gold:   #e0b07a;
  --gold-2: #d4a574;
  --cyan:   #54d6e0;
  --green:  #7fcf9e;
  --violet: #b3a4f0;

  --radius: 14px;
  --maxw: 1180px;

  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --disp: "Space Grotesk", var(--sans);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
}

body::before {
  content: "";
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(900px 520px at 78% -8%, rgba(224, 176, 122, 0.10), transparent 60%),
    radial-gradient(720px 460px at 8% 12%, rgba(84, 214, 224, 0.07), transparent 55%),
    var(--bg);
}
body::after {
  content: "";
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(circle at 50% 30%, black, transparent 80%);
}

/* ---- nav ---- */
.cal-nav {
  position: sticky; top: 0; z-index: 90;
  backdrop-filter: blur(16px);
  background: rgba(10, 11, 14, 0.85);
  border-bottom: 1px solid var(--border);
  padding: 12px 0;
}
.cal-nav .wrap { display: flex; align-items: center; justify-content: space-between; max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }
.cal-nav-brand { display: flex; align-items: center; gap: 10px; font-family: var(--disp); font-weight: 700; font-size: 16px; }
.cal-nav-brand .dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--cyan), var(--gold)); box-shadow: 0 0 10px var(--gold); }
.cal-nav-actions { display: flex; gap: 10px; }
.cal-btn {
  font-family: var(--sans); font-size: 13px; font-weight: 500;
  color: var(--text-dim); background: var(--bg-card);
  border: 1px solid var(--border); border-radius: 9px;
  padding: 8px 16px; cursor: pointer; text-decoration: none;
  transition: color .2s, background .2s, border-color .2s;
  display: inline-flex; align-items: center; gap: 7px;
}
.cal-btn:hover { color: var(--text); background: var(--bg-card-2); border-color: var(--border-strong); }
.cal-btn.primary { background: rgba(84, 214, 224, 0.12); border-color: rgba(84, 214, 224, 0.3); color: var(--cyan); }
.cal-btn.primary:hover { background: rgba(84, 214, 224, 0.2); }

/* ---- header ---- */
.cal-header {
  max-width: var(--maxw); margin: 0 auto; padding: 42px 24px 28px;
  text-align: center;
}
.cal-header h1 {
  font-family: var(--disp); font-weight: 700; letter-spacing: -.03em;
  font-size: clamp(1.8rem, 4vw, 2.8rem); margin-bottom: 10px;
  background: linear-gradient(110deg, var(--cyan), var(--gold) 56%, var(--green));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.cal-header p { color: var(--text-dim); font-size: 1rem; }
.cal-header .today-badge {
  display: none; align-items: center; gap: 8px;
  margin-top: 16px; padding: 8px 20px;
  background: rgba(127, 207, 158, 0.1); border: 1px solid rgba(127, 207, 158, 0.3);
  border-radius: 999px; font-family: var(--mono); font-size: 13px;
  color: var(--green); cursor: pointer; transition: background .2s;
}
.cal-header .today-badge.visible { display: inline-flex; }
.cal-header .today-badge:hover { background: rgba(127, 207, 158, 0.18); }

/* ---- calendar ---- */
.cal-wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px 80px; }

.cal-month-nav {
  display: flex; align-items: center; justify-content: space-between;
  gap: 18px; margin-bottom: 26px;
}
.cal-month-heading {
  display: flex; flex-direction: column; align-items: center;
  min-width: 180px;
}
.cal-month-nav .month-label {
  font-family: var(--disp); font-weight: 700; font-size: clamp(1.35rem, 2.4vw, 1.75rem);
  letter-spacing: -.02em; line-height: 1.15;
}
.cal-month-nav .month-subtitle {
  font-family: var(--mono); font-size: 11px; color: var(--text-faint);
  margin-top: 4px;
}
.cal-nav-btns { display: flex; gap: 8px; }
.cal-nav-btn {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-dim); cursor: pointer; font-size: 24px;
  display: grid; place-items: center;
  transition: background .2s, border-color .2s, color .2s, transform .15s;
}
.cal-nav-btn:hover { background: var(--bg-card-2); border-color: var(--border-strong); color: var(--text); transform: translateY(-1px); }
.cal-today-btn {
  width: auto; padding: 0 16px; gap: 7px;
  font-family: var(--sans); font-size: 13px; font-weight: 600;
}

.cal-grid {
  display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px;
}
.cal-weekday {
  font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-faint);
  text-align: center; padding: 8px 0 12px;
}

.cal-day {
  position: relative;
  min-height: 132px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start;
  background: linear-gradient(180deg, rgba(20, 22, 30, 0.96), rgba(13, 15, 20, 0.96));
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: var(--radius); cursor: default;
  transition: border-color .2s, background .2s, transform .15s, box-shadow .2s;
  gap: 10px; overflow: hidden; padding: 18px;
}
.cal-day:nth-child(7n + 1),
.cal-day:nth-child(7n) {
  background: linear-gradient(180deg, rgba(19, 25, 29, 0.96), rgba(13, 18, 20, 0.96));
}
.cal-day.other-month {
  opacity: .46;
  background: rgba(14, 16, 21, 0.76);
  border-color: rgba(255, 255, 255, 0.055);
}
.cal-day.has-data {
  cursor: pointer;
  background: linear-gradient(145deg, rgba(84, 214, 224, 0.22), rgba(224, 176, 122, 0.11) 58%, rgba(20, 22, 30, 0.98));
  border-color: rgba(84, 214, 224, 0.72);
  box-shadow: inset 0 0 0 1px rgba(84, 214, 224, 0.14), 0 14px 34px rgba(0, 0, 0, 0.22);
}
.cal-day.has-data:hover {
  border-color: rgba(84, 214, 224, 0.95);
  background: linear-gradient(145deg, rgba(84, 214, 224, 0.32), rgba(224, 176, 122, 0.16) 58%, rgba(20, 22, 30, 0.98));
  box-shadow: inset 0 0 24px rgba(84, 214, 224, 0.12), 0 20px 42px rgba(0, 0, 0, 0.32);
  transform: translateY(-2px);
}
.cal-day.has-data:active { transform: translateY(0); }
.cal-day.has-data::before {
  content: "有日报";
  position: absolute; right: 12px; bottom: 12px;
  padding: 4px 8px; border-radius: 999px;
  background: rgba(84, 214, 224, 0.18); border: 1px solid rgba(84, 214, 224, 0.48);
  color: var(--cyan); font-family: var(--mono); font-size: 10px; line-height: 1;
  box-shadow: 0 0 14px rgba(84, 214, 224, 0.18);
}
.cal-day.today {
  border-color: rgba(127, 207, 158, 0.75);
  background: linear-gradient(145deg, rgba(127, 207, 158, 0.20), rgba(84, 214, 224, 0.08) 56%, rgba(20, 22, 30, 0.98));
  box-shadow: inset 0 0 0 1px rgba(127, 207, 158, 0.16), 0 0 0 1px rgba(127, 207, 158, 0.12);
}
.cal-day.today::after {
  content: "今天";
  position: absolute; left: 12px; bottom: 12px;
  padding: 4px 8px; border-radius: 999px;
  background: rgba(127, 207, 158, 0.18); border: 1px solid rgba(127, 207, 158, 0.48);
  color: var(--green); font-family: var(--mono); font-size: 10px; line-height: 1;
}
.cal-day.today.has-data {
  border-color: rgba(84, 214, 224, 0.95);
  box-shadow: inset 0 0 0 1px rgba(127, 207, 158, 0.22), 0 16px 36px rgba(0, 0, 0, 0.26);
}
.cal-day .day-num {
  font-family: var(--mono); font-size: clamp(22px, 2.25vw, 30px); font-weight: 700;
  color: var(--text);
}
.cal-day.other-month .day-num { color: var(--text-faint); }
.cal-day .day-label {
  font-family: var(--mono); font-size: 11px; letter-spacing: .04em;
  color: var(--text-faint); text-transform: uppercase;
}
.cal-day.has-data .day-label { color: rgba(231, 233, 240, 0.82); }

/* ---- legend ---- */
.cal-legend {
  display: flex; gap: 16px; justify-content: center; margin-top: 24px; flex-wrap: wrap;
}
.cal-legend-item {
  display: flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 11px; color: var(--text-faint);
}
.cal-legend-item .dot {
  width: 8px; height: 8px; border-radius: 50%;
}
.cal-legend-item .dot.available { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
.cal-legend-item .dot.today { background: var(--green); box-shadow: 0 0 6px var(--green); }

/* ---- footer ---- */
.cal-footer {
  max-width: var(--maxw); margin: 0 auto; padding: 24px;
  border-top: 1px solid var(--border); text-align: center;
}
.cal-footer p { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); }
.cal-footer a { color: var(--text-dim); text-decoration: none; }
.cal-footer a:hover { color: var(--gold); }

/* ---- responsive ---- */
@media (max-width: 600px) {
  .cal-header { padding: 30px 18px 22px; }
  .cal-wrap { padding: 0 12px 56px; }
  .cal-month-nav { gap: 10px; margin-bottom: 18px; }
  .cal-month-heading { min-width: 108px; }
  .cal-month-nav .month-label { font-size: 1.1rem; }
  .cal-month-nav .month-subtitle { display: none; }
  .cal-nav-btn { width: 38px; height: 38px; border-radius: 10px; font-size: 20px; }
  .cal-today-btn { padding: 0 10px; font-size: 12px; }
  .cal-grid { gap: 6px; }
  .cal-weekday { font-size: 10px; padding: 5px 0 7px; }
  .cal-day { min-height: 58px; border-radius: 10px; gap: 0; padding: 8px; align-items: center; justify-content: center; }
  .cal-day .day-num { font-size: 15px; }
  .cal-day .day-label { display: none; }
  .cal-day.has-data::before {
    content: "";
    top: 6px; right: 6px; bottom: auto; width: 6px; height: 6px; padding: 0; border: 0;
    background: var(--cyan); box-shadow: 0 0 7px var(--cyan);
  }
  .cal-day.today::after {
    content: "";
    left: 6px; bottom: 6px; width: 6px; height: 6px; padding: 0; border: 0;
    background: var(--green); box-shadow: 0 0 7px var(--green);
  }
}

@media (min-width: 601px) and (max-width: 900px) {
  .cal-day { min-height: 96px; padding: 14px; }
  .cal-day .day-num { font-size: 20px; }
}
</style>
</head>
<body>

<!-- 导航栏 -->
<nav class="cal-nav">
  <div class="wrap">
    <a class="cal-nav-brand" href="index.html">
      <span class="dot"></span>
      <span>AI 日报</span>
    </a>
    <div class="cal-nav-actions">
      <a class="cal-btn" href="index.html">← 返回首页</a>
    </div>
  </div>
</nav>

<!-- 头部 -->
<header class="cal-header">
  <h1>📅 日历</h1>
  <p>选择日期查看对应日报</p>
  <div class="today-badge" id="todayBadge" onclick="goToToday()">
    📍 今天
  </div>
</header>

<!-- 日历 -->
<main class="cal-wrap">
  <div class="cal-month-nav">
    <button class="cal-nav-btn" onclick="prevMonth()" title="上个月">‹</button>
    <div class="cal-month-heading">
      <span class="month-label" id="monthLabel"></span>
      <span class="month-subtitle" id="monthSubtitle"></span>
    </div>
    <div class="cal-nav-btns">
      <button class="cal-nav-btn" onclick="nextMonth()" title="下个月">›</button>
      <button class="cal-nav-btn cal-today-btn" onclick="goToToday()" title="返回今天">今天</button>
    </div>
  </div>
  <div class="cal-grid" id="calendarGrid"></div>
  <div class="cal-legend">
    <div class="cal-legend-item"><span class="dot available"></span> 有日报</div>
    <div class="cal-legend-item"><span class="dot today"></span> 今天</div>
  </div>
</main>

<!-- 页脚 -->
<footer class="cal-footer">
  <p>AI 日报 · 由 GitHub Actions 自动生成 · <a href="sources/daily-digest/SKILL.md">关于日报</a></p>
</footer>

<script>
// ============================================================
// 配置
// ============================================================

// 可用的日报日期（由构建脚本更新）
// 格式: "YYYY-MM-DD": true
const AVAILABLE_DATES = {};

// 数据文件基础路径
const DATA_BASE = "data/";

// 月份名称
const MONTH_NAMES = [
  "一月", "二月", "三月", "四月", "五月", "六月",
  "七月", "八月", "九月", "十月", "十一月", "十二月"
];

// ============================================================
// 状态
// ============================================================

let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth(); // 0-indexed

// ============================================================
// 核心函数
// ============================================================

function getAvailableDates() {
  // 尝试从已有的 data/*.json 文件列表获取可用日期
  // 在 GitHub Pages 上，这些是静态文件
  // 实际使用时会通过构建脚本更新 AVAILABLE_DATES
  return AVAILABLE_DATES;
}

function formatDateKey(year, month, day) {
  return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
}

function isAvailable(year, month, day) {
  const key = formatDateKey(year, month, day);
  return AVAILABLE_DATES.hasOwnProperty(key);
}

function getLatestAvailableDate() {
  const dates = Object.keys(AVAILABLE_DATES)
    .filter((dateKey) => /^\d{4}-\d{2}-\d{2}$/.test(dateKey))
    .sort()
    .reverse();

  return dates[0] || null;
}

function setDefaultMonthFromAvailableDates() {
  const latestDate = getLatestAvailableDate();
  if (!latestDate) return;

  const [year, month] = latestDate.split("-").map(Number);
  currentYear = year;
  currentMonth = month - 1;
}

function isToday(year, month, day) {
  const now = new Date();
  return now.getFullYear() === year &&
         now.getMonth() === month &&
         now.getDate() === day;
}

function getWeekdayShort(dayIndex) {
  return ["日", "一", "二", "三", "四", "五", "六"][dayIndex];
}

function renderCalendar() {
  const grid = document.getElementById("calendarGrid");
  const label = document.getElementById("monthLabel");
  const subtitle = document.getElementById("monthSubtitle");

  // 设置月份标签
  label.textContent = `${currentYear} 年 ${MONTH_NAMES[currentMonth]}`;
  subtitle.textContent = getMonthDataSummary(currentYear, currentMonth);

  // 清空网格
  grid.innerHTML = "";

  // 渲染星期标题
  for (let i = 0; i < 7; i++) {
    const wd = document.createElement("div");
    wd.className = "cal-weekday";
    wd.textContent = getWeekdayShort(i);
    grid.appendChild(wd);
  }

  // 获取本月第一天和最后一天
  const firstDay = new Date(currentYear, currentMonth, 1);
  const lastDay = new Date(currentYear, currentMonth + 1, 0);
  const startWeekday = firstDay.getDay();
  const daysInMonth = lastDay.getDate();

  // 渲染上个月的部分日期
  const prevMonth = new Date(currentYear, currentMonth, 0);
  const prevDays = prevMonth.getDate();
  for (let i = startWeekday - 1; i >= 0; i--) {
    const day = prevDays - i;
    const el = createDayEl(currentYear, currentMonth - 1, day, true);
    grid.appendChild(el);
  }

  // 渲染本月日期
  for (let day = 1; day <= daysInMonth; day++) {
    const el = createDayEl(currentYear, currentMonth, day, false);
    grid.appendChild(el);
  }

  // 渲染下个月的部分日期，补满 6 行 (42 格)
  const totalCells = grid.children.length;
  const remaining = 42 - totalCells;
  for (let day = 1; day <= remaining; day++) {
    const el = createDayEl(currentYear, currentMonth + 1, day, true);
    grid.appendChild(el);
  }
}

function createDayEl(year, month, day, isOtherMonth) {
  const el = document.createElement("div");
  el.className = "cal-day";
  const available = !isOtherMonth && isAvailable(year, month, day);
  const today = !isOtherMonth && isToday(year, month, day);

  if (isOtherMonth) el.classList.add("other-month");
  if (available) el.classList.add("has-data");
  if (today) el.classList.add("today");

  el.innerHTML = `
    <span class="day-num">${day}</span>
    <span class="day-label">${getWeekdayShort(new Date(year, month, day).getDay())}</span>
  `;

  if (available) {
    const dateKey = formatDateKey(year, month, day);
    el.title = `查看 ${dateKey} 日报`;
    el.addEventListener("click", () => {
      window.location.href = `${DATA_BASE}${dateKey}.html`;
    });
  }

  return el;
}

function getMonthDataSummary(year, month) {
  const prefix = `${year}-${String(month + 1).padStart(2, "0")}-`;
  const count = Object.keys(AVAILABLE_DATES).filter((dateKey) => dateKey.startsWith(prefix)).length;
  return count > 0 ? `${count} 天日报可查看` : "暂无日报";
}

async function datePageExists(dateKey) {
  try {
    const resp = await fetch(`${DATA_BASE}${dateKey}.html`, {
      method: "HEAD",
      cache: "no-store"
    });
    return resp.ok;
  } catch (e) {
    console.warn(`[calendar] 无法验证 ${dateKey}.html`, e);
    return false;
  }
}

async function populateAvailableDates(dates) {
  const validDates = dates.filter((dateKey) => /^\d{4}-\d{2}-\d{2}$/.test(dateKey));
  const checks = await Promise.all(validDates.map(async (dateKey) => ({
    dateKey,
    exists: await datePageExists(dateKey)
  })));
  const datesWithPages = checks.filter(({ exists }) => exists).map(({ dateKey }) => dateKey);

  // If validation cannot find any pages, keep the generated list so the calendar still shows history.
  const datesToUse = datesWithPages.length > 0 ? datesWithPages : validDates;
  for (const d of datesToUse) {
    AVAILABLE_DATES[d] = true;
  }
}

function prevMonth() {
  currentMonth--;
  if (currentMonth < 0) {
    currentMonth = 11;
    currentYear--;
  }
  renderCalendar();
}

function nextMonth() {
  currentMonth++;
  if (currentMonth > 11) {
    currentMonth = 0;
    currentYear++;
  }
  renderCalendar();
}

function goToToday() {
  const now = new Date();
  currentYear = now.getFullYear();
  currentMonth = now.getMonth();
  renderCalendar();

  // 如果今天有日报，跳转过去
  const todayKey = formatDateKey(currentYear, currentMonth, now.getDate());
  if (isAvailable(currentYear, currentMonth, now.getDate())) {
    window.location.href = `${DATA_BASE}${todayKey}.html`;
  }
}

// ============================================================
// 初始化：加载可用日期列表
// ============================================================

async function loadAvailableDates() {
  // 尝试加载 data/dates.json（由构建脚本生成，包含所有可用日期列表）
  try {
    const resp = await fetch("data/dates.json");
    if (resp.ok) {
      const dates = await resp.json();
      // dates 格式: ["2025-06-01", "2025-06-02", ...]
      await populateAvailableDates(dates);
    }
  } catch (e) {
    console.warn("[calendar] 无法加载 dates.json，使用空列表", e);
  }
  setDefaultMonthFromAvailableDates();
  updateTodayBadge();
  renderCalendar();
}

function updateTodayBadge() {
  const badge = document.getElementById("todayBadge");
  const now = new Date();
  badge.classList.toggle("visible", isAvailable(now.getFullYear(), now.getMonth(), now.getDate()));
}

// 启动
loadAvailableDates();
</script>
</body>
</html>
